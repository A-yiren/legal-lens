<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金睛 RiskLens — 金融法律风险研判 AI 助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#0c4a3e', 600: '#0a3d33', 700: '#083029' },
              accent: { 500: '#d97706', 600: '#b45309' }
            },
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif']
            }
          }
        }
      }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; }
        .legal-text { font-family: "Source Han Serif SC", "Songti SC", SimSun, serif; line-height: 1.9; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 3px; }
    </style>
</head>
<body class="bg-stone-50 text-stone-900 antialiased">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-60 bg-white border-r border-stone-200 flex flex-col">
            <div class="h-16 px-6 flex items-center border-b border-stone-200">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center mr-3">
                    <i class="fa-solid fa-gavel text-white text-sm"></i>
                </div>
                <div>
                    <div class="font-semibold text-stone-900">金睛</div>
                    <div class="text-[10px] text-stone-500 tracking-wider">LEGAL LENS</div>
                </div>
            </div>
            <nav class="flex-1 px-3 py-4 space-y-1 text-sm">
                <a href="index.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-stone-100 text-stone-900 font-medium">
                    <i class="fa-solid fa-house w-4 text-stone-500"></i>工作台
                </a>
                <a href="pages/case-list.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-stone-600 hover:bg-stone-50 hover:text-stone-900">
                    <i class="fa-solid fa-briefcase w-4 text-stone-400"></i>案件库
                    <span id="nav-case-count" class="ml-auto text-[10px] bg-stone-200 text-stone-600 px-1.5 py-0.5 rounded">-</span>
                </a>
                <a href="pages/case-analysis.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-stone-600 hover:bg-stone-50 hover:text-stone-900">
                    <i class="fa-solid fa-wand-magic-sparkles w-4 text-stone-400"></i>AI 分析
                    <span class="ml-auto text-[9px] bg-accent-500 text-white px-1.5 py-0.5 rounded font-medium">核心</span>
                </a>
                <a href="pages/knowledge-base.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-stone-600 hover:bg-stone-50 hover:text-stone-900">
                    <i class="fa-solid fa-book-open w-4 text-stone-400"></i>知识库
                    <span id="nav-doc-count" class="ml-auto text-[10px] bg-stone-200 text-stone-600 px-1.5 py-0.5 rounded">-</span>
                </a>
                <a href="pages/obsidian.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-stone-600 hover:bg-stone-50 hover:text-stone-900">
                    <i class="fa-solid fa-feather w-4 text-stone-400"></i>Obsidian
                </a>
            </nav>
            <div class="p-3 border-t border-stone-200">
                <div class="flex items-center gap-3 px-2 py-2">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-stone-700 to-stone-900 flex items-center justify-center text-white text-xs font-medium">王</div>
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-medium text-stone-900">王律师</div>
                        <div class="text-[10px] text-stone-500">正天律师事务所</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Top Bar -->
            <header class="h-16 bg-white border-b border-stone-200 px-8 flex items-center gap-6">
                <h1 class="text-lg font-semibold text-stone-900">工作台</h1>
                <span class="text-xs text-stone-500" id="health-status">正在连接服务...</span>
                <div class="flex-1"></div>
                <a href="pages/case-analysis.html" class="ml-2 inline-flex items-center gap-2 px-4 py-2 bg-brand-500 text-white text-sm font-medium rounded-lg hover:bg-brand-600">
                    <i class="fa-solid fa-plus text-xs"></i>新建案件分析
                </a>
            </header>

            <div class="flex-1 overflow-y-auto scrollbar-thin">
                <div class="max-w-7xl mx-auto px-8 py-8">
                    <!-- 状态卡片 -->
                    <div class="grid grid-cols-4 gap-4 mb-8">
                        <div class="bg-white border border-stone-200 rounded-xl p-5">
                            <div class="flex items-start justify-between mb-3">
                                <div class="w-9 h-9 rounded-lg bg-brand-50 flex items-center justify-center">
                                    <i class="fa-solid fa-book text-brand-500 text-sm"></i>
                                </div>
                            </div>
                            <div class="text-2xl font-semibold text-stone-900" id="stat-docs">--</div>
                            <div class="text-xs text-stone-500 mt-1">知识库文档</div>
                        </div>
                        <div class="bg-white border border-stone-200 rounded-xl p-5">
                            <div class="flex items-start justify-between mb-3">
                                <div class="w-9 h-9 rounded-lg bg-amber-50 flex items-center justify-center">
                                    <i class="fa-solid fa-vector-square text-accent-500 text-sm"></i>
                                </div>
                            </div>
                            <div class="text-2xl font-semibold text-stone-900" id="stat-vectors">--</div>
                            <div class="text-xs text-stone-500 mt-1">向量索引</div>
                        </div>
                        <div class="bg-white border border-stone-200 rounded-xl p-5">
                            <div class="flex items-start justify-between mb-3">
                                <div class="w-9 h-9 rounded-lg bg-stone-100 flex items-center justify-center">
                                    <i class="fa-solid fa-briefcase text-stone-600 text-sm"></i>
                                </div>
                            </div>
                            <div class="text-2xl font-semibold text-stone-900" id="stat-cases">--</div>
                            <div class="text-xs text-stone-500 mt-1">案件总数</div>
                        </div>
                        <div class="bg-white border border-stone-200 rounded-xl p-5">
                            <div class="flex items-start justify-between mb-3">
                                <div class="w-9 h-9 rounded-lg bg-emerald-50 flex items-center justify-center">
                                    <i class="fa-solid fa-circle-check text-emerald-600 text-sm"></i>
                                </div>
                            </div>
                            <div class="text-2xl font-semibold text-stone-900" id="stat-llm">--</div>
                            <div class="text-xs text-stone-500 mt-1">LLM 模型</div>
                        </div>
                    </div>

                    <!-- 快速入口 -->
                    <div class="bg-gradient-to-br from-brand-500 to-brand-700 rounded-xl p-6 text-white mb-6 flex items-center justify-between">
                        <div>
                            <h3 class="text-lg font-semibold mb-1">开始一个案件分析</h3>
                            <p class="text-sm text-stone-300">描述案情，AI 自动匹配法条、生成结构化分析报告，所有结论可溯源</p>
                        </div>
                        <a href="pages/case-analysis.html" class="px-5 py-2.5 bg-white text-brand-600 text-sm font-medium rounded-lg hover:bg-stone-50 transition-colors">
                            立即开始 <i class="fa-solid fa-arrow-right text-xs ml-1"></i>
                        </a>
                    </div>

                    <!-- 最近文档 -->
                    <div class="bg-white border border-stone-200 rounded-xl">
                        <div class="px-6 py-4 border-b border-stone-200 flex items-center justify-between">
                            <h2 class="font-semibold text-stone-900">知识库最近文档</h2>
                            <a href="pages/knowledge-base.html" class="text-xs text-stone-500 hover:text-stone-900">查看全部 →</a>
                        </div>
                        <div id="recent-docs" class="divide-y divide-stone-100">
                            <div class="px-6 py-8 text-center text-sm text-stone-500">
                                正在加载...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = "/legallens";  // 子路径反代

        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/api/health`);
                const data = await res.json();
                document.getElementById('health-status').textContent = `服务正常 · ${data.app} v${data.version}`;
                document.getElementById('stat-docs').textContent = data.doc_count;
                document.getElementById('stat-vectors').textContent = data.vector_count.toLocaleString();
                document.getElementById('stat-cases').textContent = data.case_count;
                document.getElementById('stat-llm').textContent = data.llm_model.includes('abab') ? 'MiniMax' : data.llm_model;

                document.getElementById('nav-doc-count').textContent = data.doc_count;
                document.getElementById('nav-case-count').textContent = data.case_count;
            } catch (e) {
                document.getElementById('health-status').innerHTML = '<span class="text-rose-600">⚠️ 服务未连接，请先启动后端</span>';
            }
        }

        async function loadRecentDocs() {
            try {
                const res = await fetch(`${API_BASE}/api/knowledge/documents?limit=5`);
                const docs = await res.json();
                const container = document.getElementById('recent-docs');
                if (docs.length === 0) {
                    container.innerHTML = `
                        <div class="px-6 py-8 text-center">
                            <i class="fa-solid fa-folder-open text-2xl text-stone-300 mb-2"></i>
                            <p class="text-sm text-stone-500">知识库还是空的</p>
                            <a href="pages/knowledge-base.html" class="inline-block mt-3 px-4 py-2 bg-brand-500 text-white text-xs rounded-lg hover:bg-brand-600">
                                上传第一份法律文档
                            </a>
                        </div>
                    `;
                    return;
                }
                container.innerHTML = docs.map(d => `
                    <a href="pages/knowledge-base.html" class="block px-6 py-4 hover:bg-stone-50">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-lg bg-stone-100 flex items-center justify-center">
                                    <i class="fa-solid ${d.source === 'obsidian' ? 'fa-feather' : 'fa-file'} text-stone-500 text-sm"></i>
                                </div>
                                <div>
                                    <div class="text-sm font-medium text-stone-900">${d.name}</div>
                                    <div class="text-xs text-stone-500 mt-0.5">${d.chunks_count} 个法条 · 来源：${d.source === 'seed' ? '种子' : d.source === 'obsidian' ? 'Obsidian' : '上传'}</div>
                                </div>
                            </div>
                            <span class="text-[10px] px-2 py-0.5 ${d.status === 'ready' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'} rounded">${d.status}</span>
                        </div>
                    </a>
                `).join('');
            } catch (e) {
                document.getElementById('recent-docs').innerHTML = '<div class="px-6 py-8 text-center text-sm text-rose-500">加载失败</div>';
            }
        }

        loadStats();
        loadRecentDocs();
    </script>
</body>
</html>
