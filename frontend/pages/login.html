<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — 金睛 RiskLens</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#0c4a3e', 600: '#0a3d33', 700: '#083029' },
              accent: { 500: '#d97706', 600: '#b45309' }
            },
            fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'] }
          }
        }
      }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
</head>
<body class="bg-stone-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo + 标题 -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 mb-3">
                <i class="fa-solid fa-gavel text-white text-xl"></i>
            </div>
            <h1 class="text-2xl font-semibold text-stone-900">金睛 RiskLens</h1>
            <p class="text-sm text-stone-500 mt-1">律师专属 AI 案件分析平台</p>
        </div>

        <!-- 卡片 -->
        <div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-8">
            <!-- 切换 tab -->
            <div class="flex border-b border-stone-200 mb-6">
                <button id="tab-login" class="flex-1 pb-3 text-sm font-medium text-brand-600 border-b-2 border-brand-600">
                    登录
                </button>
                <button id="tab-register" class="flex-1 pb-3 text-sm font-medium text-stone-500 hover:text-stone-700 border-b-2 border-transparent">
                    注册
                </button>
            </div>

            <!-- 错误提示 -->
            <div id="error-msg" class="hidden mb-4 px-3 py-2 bg-rose-50 border border-rose-200 text-rose-700 text-sm rounded-lg"></div>

            <!-- 登录表单 -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1.5">用户名 / 邮箱</label>
                    <input type="text" name="username" required
                           class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500"
                           placeholder="username 或 email@example.com">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1.5">密码</label>
                    <input type="password" name="password" required minlength="6"
                           class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500"
                           placeholder="至少 6 位">
                </div>
                <button type="submit" id="login-btn"
                        class="w-full py-2.5 bg-brand-500 text-white text-sm font-medium rounded-lg hover:bg-brand-600 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i>登录
                </button>
            </form>

            <!-- 注册表单 -->
            <form id="register-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1.5">用户名 <span class="text-rose-500">*</span></label>
                    <input type="text" name="username" required
                           pattern="[a-zA-Z0-9_]{3,32}"
                           class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500"
                           placeholder="3-32 位，字母/数字/下划线">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1.5">显示名称 <span class="text-stone-400">(可选)</span></label>
                    <input type="text" name="display_name" maxlength="64"
                           class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500"
                           placeholder="不填则用用户名">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1.5">邮箱 <span class="text-stone-400">(可选)</span></label>
                    <input type="email" name="email"
                           class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500"
                           placeholder="email@example.com">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1.5">密码 <span class="text-rose-500">*</span></label>
                    <input type="password" name="password" required minlength="6"
                           class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500"
                           placeholder="至少 6 位">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1.5">确认密码 <span class="text-rose-500">*</span></label>
                    <input type="password" name="password2" required minlength="6"
                           class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500"
                           placeholder="再次输入">
                </div>
                <button type="submit" id="register-btn"
                        class="w-full py-2.5 bg-brand-500 text-white text-sm font-medium rounded-lg hover:bg-brand-600 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus"></i>注册并登录
                </button>
            </form>
        </div>

        <!-- 游客登录 -->
        <div class="mt-5">
            <div class="relative flex items-center justify-center mb-4">
                <div class="flex-1 border-t border-stone-200"></div>
                <span class="px-3 text-xs text-stone-400">或</span>
                <div class="flex-1 border-t border-stone-200"></div>
            </div>
            <button type="button" id="guest-btn"
                    class="w-full py-2.5 bg-white border border-stone-300 text-stone-700 text-sm font-medium rounded-lg hover:bg-stone-50 hover:border-brand-500 hover:text-brand-600 flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-user-secret"></i>游客登录（体验 Demo 数据）
            </button>
            <p class="text-center text-xs text-stone-400 mt-2">仅展示公开功能，数据每日重置</p>
        </div>

        <!-- 底部 -->
        <p class="text-center text-xs text-stone-500 mt-6">
            登录即表示您已阅读并同意 <a href="#" class="text-brand-600 hover:underline">用户协议</a> 和 <a href="#" class="text-brand-600 hover:underline">隐私政策</a>
        </p>
    </div>

    <script>
        const API_BASE = "/legallens";

        // 已登录则直接跳走
        if (localStorage.getItem("legallens_token")) {
            window.location.href = "../index.html";
        }

        const tabLogin = document.getElementById("tab-login");
        const tabRegister = document.getElementById("tab-register");
        const loginForm = document.getElementById("login-form");
        const registerForm = document.getElementById("register-form");
        const errorMsg = document.getElementById("error-msg");

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.remove("hidden");
        }
        function hideError() {
            errorMsg.classList.add("hidden");
        }

        function switchTab(tab) {
            hideError();
            if (tab === "login") {
                tabLogin.classList.add("text-brand-600", "border-brand-600");
                tabLogin.classList.remove("text-stone-500", "border-transparent");
                tabRegister.classList.remove("text-brand-600", "border-brand-600");
                tabRegister.classList.add("text-stone-500", "border-transparent");
                loginForm.classList.remove("hidden");
                registerForm.classList.add("hidden");
            } else {
                tabRegister.classList.add("text-brand-600", "border-brand-600");
                tabRegister.classList.remove("text-stone-500", "border-transparent");
                tabLogin.classList.remove("text-brand-600", "border-brand-600");
                tabLogin.classList.add("text-stone-500", "border-transparent");
                registerForm.classList.remove("hidden");
                loginForm.classList.add("hidden");
            }
        }
        tabLogin.addEventListener("click", () => switchTab("login"));
        tabRegister.addEventListener("click", () => switchTab("register"));

        function setLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.dataset.originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>处理中...';
            } else {
                btn.disabled = false;
                btn.innerHTML = btn.dataset.originalHtml || btn.innerHTML;
            }
        }

        function saveAndGoHome(data) {
            localStorage.setItem("legallens_token", data.access_token);
            localStorage.setItem("legallens_user", JSON.stringify(data.user));
            window.location.href = "../index.html";
        }

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            hideError();
            const form = e.target;
            const btn = document.getElementById("login-btn");
            setLoading(btn, true);
            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: form.username.value.trim(),
                        password: form.password.value,
                    }),
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || `HTTP ${res.status}`);
                }
                const data = await res.json();
                saveAndGoHome(data);
            } catch (err) {
                showError(err.message);
            } finally {
                setLoading(btn, false);
            }
        });

        // 游客登录: 自动用 demo / demo123 登录
        document.getElementById("guest-btn").addEventListener("click", async () => {
            hideError();
            const btn = document.getElementById("guest-btn");
            setLoading(btn, true);
            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: "demo", password: "demo123" }),
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || `HTTP ${res.status}`);
                }
                const data = await res.json();
                saveAndGoHome(data);
            } catch (err) {
                showError("游客登录失败: " + err.message);
            } finally {
                setLoading(btn, false);
            }
        });

        registerForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            hideError();
            const form = e.target;
            const btn = document.getElementById("register-btn");

            if (form.password.value !== form.password2.value) {
                showError("两次输入的密码不一致");
                return;
            }

            setLoading(btn, true);
            try {
                const body = {
                    username: form.username.value.trim(),
                    password: form.password.value,
                };
                if (form.display_name.value.trim()) body.display_name = form.display_name.value.trim();
                if (form.email.value.trim()) body.email = form.email.value.trim();

                const res = await fetch(`${API_BASE}/api/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || `HTTP ${res.status}`);
                }
                const data = await res.json();
                saveAndGoHome(data);
            } catch (err) {
                showError(err.message);
            } finally {
                setLoading(btn, false);
            }
        });
    </script>
</body>
</html>
