# 律瞳 LegalLens 子路径反代 - 写到 /etc/nginx/conf.d/legallens.conf
# 让 https://ayiren.cn/legallens/ 反代到后端 8767

# 静态文件目录（符号链接到 /opt/legal-lens/frontend）
location /legallens/ {
    alias /opt/legal-lens/frontend/;
    index index.html;
    try_files $uri $uri/ /legallens/index.html;

    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

# API 反代到后端 8767
location /legallens/api/ {
    rewrite ^/legallens/api/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:8767;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;  # LLM 分析可能慢
    proxy_send_timeout 120s;
}
